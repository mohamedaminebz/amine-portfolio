name: Deploy portfolio versions to GitHub Pages

on:
  push:
    branches: [main, v2.1, v2.2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch version branches
        run: |
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/v2.1:refs/remotes/origin/v2.1" \
            "+refs/heads/v2.2:refs/remotes/origin/v2.2"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.7.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Build all versions
        env:
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
        run: |
          set -euo pipefail

          mkdir -p site .build

          # Builds one branch into .build/<name>/dist. The caller decides where
          # the result is published, so a branch can be reused for several URLs.
          build_ref() {
            ref="$1"
            name="$2"
            base="$3"
            dir=".build/${name}"

            echo "::group::Building ${ref} for ${base}"
            mkdir -p "$dir"
            git archive "origin/${ref}" | tar -x -C "$dir"
            (
              cd "$dir"
              pnpm install --frozen-lockfile
              pnpm exec tsc -b
              pnpm exec vite build --mode production --base="$base"
            )
            echo "::endgroup::"
          }

          publish() {
            name="$1"
            out="$2"
            mkdir -p "site/${out}"
            cp -r ".build/${name}/dist/." "site/${out}/"
          }

          # `main` is the live site *and* the v3 preview: build it once and
          # publish the same output twice instead of building it twice.
          build_ref main main "/amine-portfolio/"
          publish main ""
          publish main "v3"

          # Older previews still need their own base path.
          build_ref v2.1 v2.1 "/amine-portfolio/v2.1/"
          publish v2.1 "v2.1"
          build_ref v2.2 v2.2 "/amine-portfolio/v2.2/"
          publish v2.2 "v2.2"

          # Short link: /v2/ redirects to the newest v2 version.
          mkdir -p site/v2
          cat > site/v2/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=../v2.2/" />
              <link rel="canonical" href="https://mohamedaminebz.github.io/amine-portfolio/v2.2/" />
              <title>Portfolio v2</title>
            </head>
            <body>
              <p>Redirecting to <a href="../v2.2/">portfolio v2.2</a>&hellip;</p>
            </body>
          </html>
          EOF

          # Preview builds declare themselves as the canonical URL so they are
          # not indexed twice. `/v3/` is a byte-for-byte copy of the live site,
          # so it deliberately keeps pointing at the root URL.
          for version in v2.1 v2.2; do
            sed -i \
              "s|https://mohamedaminebz.github.io/amine-portfolio/|https://mohamedaminebz.github.io/amine-portfolio/${version}/|g" \
              "site/${version}/index.html"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
