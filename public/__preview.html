<!doctype html>
<meta charset="utf-8" />
<script>
  const params = new URLSearchParams(location.search);
  if (params.get("theme")) localStorage.setItem("theme", params.get("theme"));
  if (params.get("lang")) localStorage.setItem("i18nextLng", params.get("lang"));
  const hash = params.get("hash");
  location.replace(
    "/amine-portfolio/" + (hash ? "#" + decodeURIComponent(hash) : ""),
  );
</script>
