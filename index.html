    <!-- Apply the saved theme before React mounts to avoid a flash of the wrong palette. -->
    <script>
      (function () {
        try {
          // Keep these maps in sync with src/lib/themes.ts.
          var modes = {
            fog: "light",
            paper: "light",
            sage: "light",
            ink: "dark",
            carbon: "dark",
            marine: "dark",
          };
          var colors = {
            fog: "#f2f4f9",
            paper: "#f5f3ee",
            sage: "#eff4ef",
            ink: "#080b15",
            carbon: "#0a0a0b",
            marine: "#061013",
          };
          var stored = localStorage.getItem("theme");
          if (stored === "light") stored = "fog";
          else if (stored === "dark") stored = "ink";

          var theme = Object.prototype.hasOwnProperty.call(modes, stored)
            ? stored
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "fog"
              : "ink";
          var mode = modes[theme];

          document.documentElement.classList.add(mode);
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = mode;

          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i += 1) {
            metas[i].setAttribute("content", colors[theme]);
          }
        } catch (error) {
          document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = "ink";
          document.documentElement.style.colorScheme = "dark";

          var fallbackMetas = document.querySelectorAll(
            'meta[name="theme-color"]',
          );
          for (var j = 0; j < fallbackMetas.length; j += 1) {
            fallbackMetas[j].setAttribute("content", "#080b15");
          }
        }
      })();
    </script>
